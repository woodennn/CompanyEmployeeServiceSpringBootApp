<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Особистий кабінет співробітника</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 700px;">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Особистий кабінет</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">На головну</a>
</div>

<div th:if="${error}" class="alert alert-warning card p-4 shadow-sm text-center">
    <h4 class="alert-heading text-warning mb-3">Увага!</h4>
    <p th:text="${error}" class="mb-0 fs-5 text-muted"></p>
</div>

<div th:if="${employee}" class="card shadow">
    <div class="card-header bg-info text-white">
        <h4 class="mb-0" th:text="'Картка співробітника: ' + ${employee.fullName}"></h4>
    </div>
    <div class="card-body">
        <table class="table table-borderless fs-5 my-2">
            <tr>
                <th style="width: 30%;" class="text-secondary">Департамент:</th>
                <td th:text="${employee.department?.name}">Не вказано</td>
            </tr>
            <tr>
                <th class="text-secondary">Контакти:</th>
                <td th:text="${employee.contactInfo}">Не вказано</td>
            </tr>
            <tr>
                <th class="text-secondary">Адреса:</th>
                <td th:text="${employee.address}">Не вказано</td>
            </tr>
            <tr>
                <th class="text-secondary">Зарплата:</th>
                <td class="fw-bold text-success" th:text="${employee.salary} + ' ₴'">0.00</td>
            </tr>
        </table>
    </div>
    <div class="card-footer bg-light text-end">
        <small class="text-muted" th:text="'Системний логін: ' + ${#authentication.name}"></small>
    </div>
</div>

</body>
</html>
