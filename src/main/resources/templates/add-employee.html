<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новий співробітник</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 600px;">
<h2>Реєстрація співробітника</h2>

<form th:action="@{/employee/save}" th:object="${employee}" method="POST">

    <div class="mb-3">
        <label class="form-label">ПІБ</label>
        <input type="text" th:field="*{fullName}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Департамент:</label>
        <select name="departmentId" class="form-select" required>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
        </select>
    </div>

    <div class="card p-3 mb-4 bg-light">
        <h5 class="text-secondary mb-3">Дані для Особистого кабінету (Customer)</h5>
        <div class="mb-3">
            <label class="form-label">Логін (Username):</label>
            <input type="text" name="username" class="form-control" placeholder="Наприклад: ivan_ivanov">
        </div>
        <div class="mb-0">
            <label class="form-label">Пароль:</label>
            <input type="password" name="password" class="form-control" placeholder="Введіть пароль">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Контакти</label>
        <input type="text" th:field="*{contactInfo}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Адреса</label>
        <input type="text" th:field="*{address}" class="form-control" required>
    </div>

    <div class="mb-4">
        <label class="form-label">Зарплата</label>
        <input type="number" step="0.01" th:field="*{salary}" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a th:href="@{/}" class="btn btn-secondary">Скасувати</a>
</form>
</body>
</html>
