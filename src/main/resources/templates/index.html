<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управління персоналом</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Департаменти</h2>
<form th:action="@{/department/add}" method="POST" class="row g-3 mb-4">
    <div class="col-auto"><input type="text" name="name" class="form-control" placeholder="Назва департаменту" required></div>
    <div class="col-auto"><button type="submit" class="btn btn-success">Додати</button></div>
</form>

<h2>Співробітники</h2>
<a th:href="@{/employee/add}" class="btn btn-primary mb-3">Додати співробітника</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>ПІБ</th>
        <th>Департамент</th>
        <th>Контакти</th>
        <th>Адреса</th>
        <th>Зарплата</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.fullName}"></td>
        <td th:text="${e.department?.name}"></td>
        <td th:text="${e.contactInfo}"></td>
        <td th:text="${e.address}"></td>
        <td th:text="${e.salary}"></td>
        <td><a th:href="@{/employee/delete/{id}(id=${e.id})}" class="btn btn-danger btn-sm">Видалити</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
